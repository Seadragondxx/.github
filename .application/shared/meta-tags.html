<!-- Universal PWA Meta Tags -->
<!-- Copy these into your <head> section -->

<!-- Primary Meta Tags -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="title" content="Get0ff App">
<meta name="description" content="Secure progressive web application">
<meta name="author" content="Your Name">
<meta name="robots" content="index, follow">

<!-- Theme Colors -->
<meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">

<!-- PWA Manifest -->
<link rel="manifest" href="/manifest.json" crossorigin="use-credentials">

<!-- Favicon -->
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png">
<link rel="shortcut icon" href="/favicon.ico">

<!-- Apple/iOS -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Get0ff">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon-180x180.png">
<link rel="mask-icon" href="/icons/safari-pinned-tab.svg" color="#0f172a">

<!-- Microsoft/Windows -->
<meta name="msapplication-TileColor" content="#0f172a">
<meta name="msapplication-TileImage" content="/icons/ms-icon-144x144.png">
<meta name="msapplication-config" content="/browserconfig.xml">

<!-- Mobile Optimizations -->
<meta name="format-detection" content="telephone=no">
<meta name="mobile-web-app-capable" content="yes">

<!-- Open Graph / Facebook -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://example.com/">
<meta property="og:title" content="Get0ff App">
<meta property="og:description" content="Secure progressive web application">
<meta property="og:image" content="https://example.com/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<!-- Twitter -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:url" content="https://example.com/">
<meta name="twitter:title" content="Get0ff App">
<meta name="twitter:description" content="Secure progressive web application">
<meta name="twitter:image" content="https://example.com/twitter-image.png">

<!-- Security Headers (set via server, listed here for reference) -->
<!--
Content-Security-Policy: default-src 'self';
Strict-Transport-Security: max-age=31536000; includeSubDomains
X-Content-Type-Options: nosniff
X-Frame-Options: DENY
Referrer-Policy: strict-origin-when-cross-origin
-->

<!-- Preconnect to Required Origins -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<!-- DNS Prefetch -->
<link rel="dns-prefetch" href="https://api.example.com">
