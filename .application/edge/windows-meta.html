<!-- Microsoft Edge / Windows Meta Tags -->
<!-- Copy these into your <head> section -->

<!-- Windows Tile Configuration -->
<meta name="msapplication-TileColor" content="#0f172a">
<meta name="msapplication-TileImage" content="/icons/ms-icon-144x144.png">
<meta name="msapplication-config" content="/browserconfig.xml">

<!-- Windows App Capabilities -->
<meta name="msapplication-tap-highlight" content="no">
<meta name="msapplication-starturl" content="/">
<meta name="msapplication-navbutton-color" content="#0f172a">

<!-- Windows 10/11 Taskbar -->
<meta name="msapplication-task" content="name=Dashboard;action-uri=/dashboard;icon-uri=/icons/shortcut-dashboard.ico">
<meta name="msapplication-task" content="name=Settings;action-uri=/settings;icon-uri=/icons/shortcut-settings.ico">

<!-- Windows Tooltip -->
<meta name="msapplication-tooltip" content="Get0ff - Secure Application">

<!-- Windows Badge Notifications -->
<meta name="msapplication-badge" content="frequency=30;polling-uri=/api/notifications/badge">

<!-- Edge-specific -->
<meta name="msapplication-allowDomainApiCalls" content="true">
<meta name="msapplication-allowDomainMetaTags" content="true">

<!-- Standard manifest link -->
<link rel="manifest" href="/manifest.json" crossorigin="use-credentials">
